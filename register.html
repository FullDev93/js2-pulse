<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register · Pulse</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/pages/register.js"></script>
  </head>
  <body>
    <main class="container auth">
      <div class="card">
        <h1 class="brand">
          <svg class="brand-mark" viewBox="0 0 24 12" aria-hidden="true">
            <polyline points="1 6 6 6 8.5 2 12 10 15 4 17 6 23 6" />
          </svg>
          Pulse
        </h1>
        <h2>Register</h2>
        <p id="message"></p>
        <form id="register-form">
          <label>
            Name
            <input
              type="text"
              name="name"
              pattern="\w+"
              title="Letters, numbers and _ only"
              required
            />
          </label>
          <label>
            Email
            <input
              type="email"
              name="email"
              pattern=".+@stud\.noroff\.no"
              title="Use your @stud.noroff.no email"
              required
            />
          </label>
          <label>
            Password
            <input type="password" name="password" minlength="8" required />
          </label>
          <button type="submit">Register</button>
        </form>
        <p>Already have an account?</p>
        <a class="secondary-link" href="index.html">Log in</a>
      </div>
    </main>
  </body>
</html>
